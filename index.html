<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Urna Eletrônica 3D Model</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #ffffff;
            font-family: 'Inter', sans-serif;
        }
        canvas {
            display: block;
            width: 100vw;
            height: 100vh;
        }
        #ui-overlay {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(255, 255, 255, 0.9);
            padding: 10px 20px;
            border-radius: 30px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            pointer-events: none;
            color: #333;
            font-size: 14px;
            font-weight: 500;
        }
    </style>
</head>
<body>
    <div id="ui-overlay">Arraste para girar • Role para zoom • Clique nas teclas para interagir</div>
    <script>
        let scene, camera, renderer, controls;
        let audioCtx, raycaster, pointer;
        let interactableKeys = [];
        let isAudioInitialized = false;

        // New globals for UI Screen
        let screenCanvas, screenCtx, screenTexture;
        let voteState = 'typing'; // 'typing', 'branco', 'fim'
        let typedNumbers = '';
        const MAX_DIGITS = 2;
        const MOCK_CANDIDATES = {
            '12': { name: 'Ciro Gomes', party: 'PDT' },
            '13': { name: 'Luiz Inácio Lula da Silva', party: 'PT' },
            '15': { name: 'Simone Tebet', party: 'MDB' },
            '22': { name: 'Jair Bolsonaro', party: 'PL' }
        };

        function init() {
            // Scene Setup
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0xffffff);
            scene.fog = new THREE.Fog(0xffffff, 50, 150);

            // Camera Setup
            camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, 30, 65);

            // Renderer Setup
            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(window.devicePixelRatio);
            renderer.shadowMap.enabled = true;
            renderer.shadowMap.type = THREE.PCFSoftShadowMap;
            document.body.appendChild(renderer.domElement);

            // Controls Setup
            controls = new THREE.OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;
            controls.dampingFactor = 0.05;
            controls.maxPolarAngle = Math.PI / 2 - 0.05; // Prevent going below ground
            controls.minDistance = 20;
            controls.maxDistance = 100;
            controls.target.set(0, 5, 0);

            setupLighting();
            createEnvironment();
            buildUrna();
            
            // Initialize Screen Content
            updateScreen();

            // Handle Resize
            window.addEventListener('resize', onWindowResize, false);

            raycaster = new THREE.Raycaster();
            pointer = new THREE.Vector2();
            window.addEventListener('pointerdown', onPointerDown, false);

            // Start Animation Loop
            animate();
        }

        function setupLighting() {
            const ambientLight = new THREE.AmbientLight(0xffffff, 0.65);
            scene.add(ambientLight);

            const directionalLight = new THREE.DirectionalLight(0xffffff, 0.6);
            directionalLight.position.set(25, 50, 35);
            directionalLight.castShadow = true;
            
            // Refine shadow properties
            directionalLight.shadow.mapSize.width = 2048;
            directionalLight.shadow.mapSize.height = 2048;
            directionalLight.shadow.camera.near = 0.5;
            directionalLight.shadow.camera.far = 150;
            directionalLight.shadow.camera.left = -30;
            directionalLight.shadow.camera.right = 30;
            directionalLight.shadow.camera.top = 30;
            directionalLight.shadow.camera.bottom = -30;
            directionalLight.shadow.bias = -0.0005;

            scene.add(directionalLight);
        }

        function createEnvironment() {
            const floorGeo = new THREE.PlaneGeometry(500, 500);
            const floorMat = new THREE.MeshStandardMaterial({ 
                color: 0xffffff,
                roughness: 1.0,
                metalness: 0.0
            });
            const floor = new THREE.Mesh(floorGeo, floorMat);
            floor.rotation.x = -Math.PI / 2;
            floor.receiveShadow = true;
            scene.add(floor);
        }

        // Helper function to create soft rounded boxes using ExtrudeGeometry
        function createRoundedRectGeo(width, height, depth, radius, bevel = 0.05) {
            const shape = new THREE.Shape();
            const x = -width / 2;
            const y = -height / 2;
            
            shape.moveTo(x, y + radius);
            shape.lineTo(x, y + height - radius);
            shape.quadraticCurveTo(x, y + height, x + radius, y + height);
            shape.lineTo(x + width - radius, y + height);
            shape.quadraticCurveTo(x + width, y + height, x + width, y + height - radius);
            shape.lineTo(x + width, y + radius);
            shape.quadraticCurveTo(x + width, y, x + width - radius, y);
            shape.lineTo(x + radius, y);
            shape.quadraticCurveTo(x, y, x, y + radius);

            const innerDepth = Math.max(0.01, depth - (bevel * 2));
            const extrudeSettings = {
                depth: innerDepth,
                bevelEnabled: true,
                bevelSegments: 6,
                steps: 1,
                bevelSize: bevel,
                bevelThickness: bevel
            };

            const geo = new THREE.ExtrudeGeometry(shape, extrudeSettings);
            // Center the depth so it acts just like a BoxGeometry
            geo.translate(0, 0, -innerDepth / 2);
            return geo;
        }

        function buildUrna() {
            const urnaGroup = new THREE.Group();

            // 1. Main Body Geometry
            const bodyShape = new THREE.Shape();
            bodyShape.moveTo(0, 0);
            bodyShape.lineTo(27.9, 0);
            bodyShape.lineTo(27.9, 2.7);
            bodyShape.lineTo(15.3, 15.3);
            bodyShape.lineTo(0, 15.3);
            bodyShape.lineTo(0, 0);

            const extrudeSettings = {
                depth: 42,
                bevelEnabled: true,
                bevelSegments: 10, // Increased for softer corners
                steps: 1,
                bevelSize: 0.6,    // Increased thickness for the bevel
                bevelThickness: 0.6
            };

            const bodyGeo = new THREE.ExtrudeGeometry(bodyShape, extrudeSettings);
            const bodyMat = new THREE.MeshStandardMaterial({ 
                color: 0xd9d3c5, // Light beige
                roughness: 0.7,
                metalness: 0.1
            });

            const mainBody = new THREE.Mesh(bodyGeo, bodyMat);
            mainBody.rotation.y = -Math.PI / 2;
            // Position to center the 42 width on X, and set the slanted face towards +Z
            mainBody.position.set(21, 0, -13.95);
            mainBody.castShadow = true;
            mainBody.receiveShadow = true;
            urnaGroup.add(mainBody);

            // 2. The Slanted Face (Screen & Panel)
            const slantedFace = new THREE.Group();
            // Align perfectly with the extruded slope
            slantedFace.position.set(0, 2.7, 13.95);
            slantedFace.rotation.x = -Math.PI / 4;
            // Translate slightly outward along local Z normal to completely clear the main body's 0.6 bevel
            slantedFace.translateZ(0.7);
            urnaGroup.add(slantedFace);

            // Screen Bezel (Now softly rounded)
            const bezelGeo = createRoundedRectGeo(19, 13.5, 0.2, 0.5, 0.05);
            const bezelMat = new THREE.MeshStandardMaterial({ color: 0x333333, roughness: 0.8 });
            const bezel = new THREE.Mesh(bezelGeo, bezelMat);
            bezel.position.set(-9, 8.91, 0.1);
            bezel.castShadow = true;
            bezel.receiveShadow = true;
            slantedFace.add(bezel);

            // Screen (Restored as PlaneGeometry for perfect UV mapping and crisp UI)
            screenCanvas = document.createElement('canvas');
            screenCanvas.width = 640;
            screenCanvas.height = 480;
            screenCtx = screenCanvas.getContext('2d');
            screenTexture = new THREE.CanvasTexture(screenCanvas);
            screenTexture.minFilter = THREE.LinearFilter;
            if (renderer) screenTexture.anisotropy = renderer.capabilities.getMaxAnisotropy();

            const screenGeo = new THREE.PlaneGeometry(18, 12.5);
            const screenMat = new THREE.MeshBasicMaterial({ map: screenTexture });
            const screen = new THREE.Mesh(screenGeo, screenMat);
            // Placed precisely 0.01 units above the bezel's front face (which rests at 0.1 + 0.1(depth/2) + 0.05(bevel) = 0.25)
            screen.position.set(-9, 8.91, 0.26);
            slantedFace.add(screen);

            // Keypad Panel (Now softly rounded)
            const panelGeo = createRoundedRectGeo(16, 14.5, 0.4, 0.8, 0.1);
            const panelMat = new THREE.MeshStandardMaterial({ color: 0x262626, roughness: 0.9 });
            const panel = new THREE.Mesh(panelGeo, panelMat);
            panel.position.set(10, 7.25, 0.2);
            panel.castShadow = true;
            panel.receiveShadow = true;
            slantedFace.add(panel);

            function createHeaderTexture() {
                const canvas = document.createElement('canvas');
                canvas.width = 1024;
                canvas.height = 256;
                const ctx = canvas.getContext('2d');
                const texture = new THREE.CanvasTexture(canvas);

                // Helper para desenhar o texto e atualizar a textura
                function drawText() {
                    ctx.filter = 'none'; // reset filter so text is normal
                    
                    ctx.fillStyle = '#222222';
                    ctx.font = 'bold 65px Arial, sans-serif';
                    ctx.textAlign = 'left';
                    ctx.textBaseline = 'alphabetic';
                    ctx.fillText('JUSTIÇA', 420, 110);
                    ctx.fillText('ELEITORAL', 420, 185);
                    
                    if (renderer) texture.anisotropy = renderer.capabilities.getMaxAnisotropy();
                    texture.needsUpdate = true;
                }

                const img = new Image();
                img.crossOrigin = "Anonymous";
                
                img.onload = function() {
                    ctx.clearRect(0, 0, canvas.width, canvas.height);
                    
                    // Aplicando o filtro monocromático solicitado
                    ctx.filter = 'grayscale(100%) brightness(70%) contrast(120%)';
                    
                    // Desenha o SVG com tamanho fixo (180x180) para evitar problemas de dimensões ausentes em SVGs
                    ctx.drawImage(img, 250 - 90, 128 - 90, 180, 180);
                    
                    drawText();
                };
                
                img.onerror = function() {
                    // Fallback: se a imagem falhar, pelo menos desenha o texto
                    ctx.clearRect(0, 0, canvas.width, canvas.height);
                    drawText();
                    console.warn("Falha ao carregar a imagem do Brasão. Carregando apenas texto.");
                };
                
                // URL atualizada do arquivo SVG oficial
                img.src = 'https://upload.wikimedia.org/wikipedia/commons/b/bf/Coat_of_arms_of_Brazil.svg';

                return texture;
            }

            const headerTexture = createHeaderTexture();
            const headerGeo = new THREE.PlaneGeometry(10, 3);
            const headerMat = new THREE.MeshBasicMaterial({ 
                map: headerTexture, 
                transparent: true 
            });
            const headerMesh = new THREE.Mesh(headerGeo, headerMat);
            // Move up on local Y to clear the dark keypad panel perfectly
            headerMesh.position.set(10, 16.5, 0.06); 
            slantedFace.add(headerMesh);

            // Keys Setup
            const keysGroup = new THREE.Group();
            keysGroup.position.set(10, 7.25, 0.4); 
            slantedFace.add(keysGroup);

            // Helper to create crisp, high-res text/braille overlaid perfectly on the keys via a flat plane
            function createKeyTextPlane(w, h, textColorHex, text, isActionKey = false) {
                const canvas = document.createElement('canvas');
                const res = 120; // High resolution multiplier for sharpness
                canvas.width = w * res;
                canvas.height = h * res;
                const ctx = canvas.getContext('2d');

                ctx.textBaseline = 'middle';
                const cw = canvas.width;
                const ch = canvas.height;

                if (!isActionKey) {
                    // NUMERIC KEYS
                    ctx.fillStyle = textColorHex;
                    ctx.font = '900 110px sans-serif'; // Thicker font
                    ctx.textAlign = 'center';
                    
                    // Left-align the number
                    const numX = cw * 0.35;
                    const numY = ch * 0.52;
                    ctx.fillText(text, numX, numY);

                    // Braille simulation on the right side
                    ctx.fillStyle = '#555555'; 
                    const brailleRadius = 6.5; // Increased dot size
                    const brailleStartX = cw * 0.65; // Moved to the right
                    const brailleStartY = ch * 0.35;
                    const brailleSpacingX = 22;
                    const brailleSpacingY = 22;

                    for(let i = 0; i < 6; i++) {
                        const col = i % 2;
                        const row = Math.floor(i / 2);
                        const bx = brailleStartX + col * brailleSpacingX;
                        const by = brailleStartY + row * brailleSpacingY;
                        ctx.beginPath();
                        ctx.arc(bx, by, brailleRadius, 0, Math.PI*2);
                        ctx.fill();
                    }

                    // Tactile line specifically for number 5
                    if (text === '5') {
                        ctx.strokeStyle = '#555555';
                        ctx.lineWidth = 6;
                        ctx.lineCap = 'round';
                        ctx.beginPath();
                        ctx.moveTo(numX - 20, ch * 0.85);
                        ctx.lineTo(numX + 20, ch * 0.85);
                        ctx.stroke();
                    }

                } else {
                    // ACTION KEYS
                    ctx.fillStyle = textColorHex;
                    ctx.font = 'bold ' + (w > 4 ? '54px' : '46px') + ' sans-serif'; // Increased font size
                    ctx.textAlign = 'center';
                    
                    // Text closer to top edge, adjusted for the larger font
                    const textY = ch * 0.36;
                    ctx.fillText(text, cw / 2, textY);
                    
                    // Braille centered below
                    // White keys get a slightly darker grey for visibility, colored keys get dark semi-transparent
                    ctx.fillStyle = (text === 'BRANCO') ? '#dddddd' : 'rgba(0,0,0,0.3)'; 
                    const brailleRadius = 5.5;
                    const brailleStartY = ch * 0.78; // Pushed down slightly to balance
                    const brailleSpacingX = 22;
                    const brailleSpacingY = 18;

                    const numDots = (text === 'CONFIRMA') ? 10 : (text === 'CORRIGE' ? 10 : 8);
                    const cols = numDots / 2;
                    const startX = (cw / 2) - ((cols - 1) * brailleSpacingX / 2);
                    
                    for(let i = 0; i < numDots; i++) {
                        const col = i % cols;
                        const row = Math.floor(i / cols);
                        const bx = startX + col * brailleSpacingX;
                        const by = brailleStartY + row * brailleSpacingY;
                        ctx.beginPath();
                        ctx.arc(bx, by, brailleRadius, 0, Math.PI*2);
                        ctx.fill();
                    }
                }

                const texture = new THREE.CanvasTexture(canvas);
                if (renderer) texture.anisotropy = renderer.capabilities.getMaxAnisotropy();
                
                const planeGeo = new THREE.PlaneGeometry(w, h);
                const planeMat = new THREE.MeshBasicMaterial({ 
                    map: texture, 
                    transparent: true,
                    depthWrite: false
                });
                
                const plane = new THREE.Mesh(planeGeo, planeMat);
                // Position exactly on the flat front face
                plane.position.z = 0.305; 
                return plane;
            }

            const numKeyGeo = createRoundedRectGeo(2.4, 1.8, 0.6, 0.2, 0.08); // Rounded numeric keys
            const numLayout = [
                { text: '1', x: -3.5, y: 5.2 }, { text: '2', x: 0, y: 5.2 }, { text: '3', x: 3.5, y: 5.2 },
                { text: '4', x: -3.5, y: 2.2 }, { text: '5', x: 0, y: 2.2 }, { text: '6', x: 3.5, y: 2.2 },
                { text: '7', x: -3.5, y: -0.8 }, { text: '8', x: 0, y: -0.8 }, { text: '9', x: 3.5, y: -0.8 },
                { text: '0', x: 0, y: -3.6 }
            ];

            numLayout.forEach(key => {
                const solidMat = new THREE.MeshStandardMaterial({ color: '#1a1a1a', roughness: 0.8 });
                const mesh = new THREE.Mesh(numKeyGeo, solidMat);
                mesh.position.set(key.x, key.y, 0.3);
                mesh.castShadow = true;
                mesh.receiveShadow = true;
                
                // Overlay text plane
                const textPlane = createKeyTextPlane(2.4, 1.8, '#ffffff', key.text, false);
                mesh.add(textPlane); 
                
                mesh.userData = { action: 'beep', text: key.text, originalZ: 0.3, isPressed: false };
                interactableKeys.push(mesh); // Raycast hits the solid body
                
                keysGroup.add(mesh);
            });

            // Action Keys
            const actionKeys = [
                { text: 'BRANCO', w: 3.8, h: 1.8, x: -4.8, y: -6.1, bg: '#ffffff', fg: '#000000', action: 'beep' },
                { text: 'CORRIGE', w: 3.8, h: 1.8, x: -0.2, y: -6.1, bg: '#ff5500', fg: '#000000', action: 'beep' },
                { text: 'CONFIRMA', w: 4.4, h: 2.2, x: 4.8, y: -5.9, bg: '#00cc00', fg: '#000000', action: 'confirma' }
            ];

            actionKeys.forEach(key => {
                const geo = createRoundedRectGeo(key.w, key.h, 0.6, 0.2, 0.08); // Rounded action keys
                const solidMat = new THREE.MeshStandardMaterial({ color: key.bg, roughness: 0.8 });
                const mesh = new THREE.Mesh(geo, solidMat);
                mesh.position.set(key.x, key.y, 0.3);
                mesh.castShadow = true;
                mesh.receiveShadow = true;
                
                // Overlay text plane
                const textPlane = createKeyTextPlane(key.w, key.h, key.fg, key.text, true);
                mesh.add(textPlane); 
                
                mesh.userData = { action: key.action, text: key.text, originalZ: 0.3, isPressed: false };
                interactableKeys.push(mesh); // Raycast hits the solid body
                
                keysGroup.add(mesh);
            });

            // Details: 15 Grooves at bottom front lip (Softened)
            const grooveGeo = createRoundedRectGeo(0.2, 1.5, 0.1, 0.05, 0.02);
            const grooveMat = new THREE.MeshStandardMaterial({ color: 0xaaaaaa, roughness: 0.9 });
            
            for (let i = 0; i < 15; i++) {
                const groove = new THREE.Mesh(grooveGeo, grooveMat);
                // Spread evenly from X = -18 to 18
                const posX = -18 + i * (36 / 14);
                groove.position.set(posX, 1.35, 14.05);
                groove.castShadow = true;
                groove.receiveShadow = true;
                urnaGroup.add(groove);
            }

            scene.add(urnaGroup);
        }

        function initAudio() {
            if (!isAudioInitialized) {
                const AudioContext = window.AudioContext || window.webkitAudioContext;
                audioCtx = new AudioContext();
                isAudioInitialized = true;
            }
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
        }

        function playBeep() {
            if (!audioCtx) return;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = 'sine';
            osc.frequency.setValueAtTime(1200, audioCtx.currentTime); // High pitch typical of the Urna
            
            gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.1);
            
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            
            osc.start();
            osc.stop(audioCtx.currentTime + 0.1);
        }

        function playConfirma() {
            if (!audioCtx) return;
            const now = audioCtx.currentTime;
            const notes = 6;
            const noteDuration = 0.05;
            const gap = 0.03;
            
            // Fast trill sequence "pilililili"
            for (let i = 0; i < notes; i++) {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = 'square';
                osc.frequency.setValueAtTime(2000, now + i * (noteDuration + gap));
                
                gain.gain.setValueAtTime(0.04, now + i * (noteDuration + gap));
                gain.gain.setValueAtTime(0, now + i * (noteDuration + gap) + noteDuration);
                
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                
                osc.start(now + i * (noteDuration + gap));
                osc.stop(now + i * (noteDuration + gap) + noteDuration);
            }
            
            // Final long tone
            const finalStart = now + notes * (noteDuration + gap);
            const finalOsc = audioCtx.createOscillator();
            const finalGain = audioCtx.createGain();
            finalOsc.type = 'square';
            finalOsc.frequency.setValueAtTime(2000, finalStart);
            
            finalGain.gain.setValueAtTime(0.04, finalStart);
            finalGain.gain.linearRampToValueAtTime(0.04, finalStart + 0.7);
            finalGain.gain.exponentialRampToValueAtTime(0.001, finalStart + 1.0);
            
            finalOsc.connect(finalGain);
            finalGain.connect(audioCtx.destination);
            
            finalOsc.start(finalStart);
            finalOsc.stop(finalStart + 1.0);
        }

        function onPointerDown(event) {
            initAudio(); // Initialize audio context on first user interaction
            
            pointer.x = (event.clientX / window.innerWidth) * 2 - 1;
            pointer.y = -(event.clientY / window.innerHeight) * 2 + 1;
            
            raycaster.setFromCamera(pointer, camera);
            
            // Raycast against the keys
            const intersects = raycaster.intersectObjects(interactableKeys);
            
            if (intersects.length > 0) {
                const key = intersects[0].object;
                pressKey(key);
            }
        }
        
        function pressKey(keyMesh) {
            if (keyMesh.userData.isPressed) return; // Prevent spamming
            
            keyMesh.userData.isPressed = true;
            keyMesh.position.z -= 0.15; // Visual depression relative to the slanted surface
            
            const action = keyMesh.userData.action;
            const text = keyMesh.userData.text;
            
            const confirmed = processVotingInput(action, text);
            
            if (action === 'confirma' && confirmed) {
                playConfirma();
            } else {
                playBeep();
            }
            
            // Restore position after a short delay
            setTimeout(() => {
                keyMesh.position.z = keyMesh.userData.originalZ; 
                keyMesh.userData.isPressed = false;
            }, 150);
        }

        // --- UI Screen Logic ---
        function updateScreen() {
            if (!screenCtx || !screenTexture) return;

            // Clear background
            screenCtx.fillStyle = '#e8ecef'; 
            screenCtx.fillRect(0, 0, screenCanvas.width, screenCanvas.height);

            if (voteState === 'fim') {
                screenCtx.fillStyle = '#000000';
                screenCtx.font = 'bold 150px sans-serif';
                screenCtx.textAlign = 'center';
                screenCtx.textBaseline = 'middle';
                screenCtx.fillText('FIM', screenCanvas.width / 2, screenCanvas.height / 2);
                screenTexture.needsUpdate = true;
                return;
            }

            // Fixed Text Layout
            screenCtx.fillStyle = '#000000';
            screenCtx.textAlign = 'left';
            screenCtx.textBaseline = 'top';

            screenCtx.font = '24px sans-serif';
            screenCtx.fillText('SEU VOTO PARA', 20, 20);
            
            screenCtx.font = 'bold 42px sans-serif';
            screenCtx.textAlign = 'center';
            screenCtx.fillText('PRESIDENTE', screenCanvas.width / 2, 60);

            screenCtx.textAlign = 'left';

            if (voteState === 'branco') {
                screenCtx.font = 'bold 64px sans-serif';
                screenCtx.textAlign = 'center';
                screenCtx.fillText('VOTO EM BRANCO', screenCanvas.width / 2, 220);
            } else {
                // Number Boxes
                const boxSize = 65;
                const boxSpacing = 15;
                const startX = 20;
                const startY = 130;

                for (let i = 0; i < MAX_DIGITS; i++) {
                    screenCtx.strokeStyle = '#000000';
                    screenCtx.lineWidth = 3;
                    screenCtx.strokeRect(startX + i * (boxSize + boxSpacing), startY, boxSize, boxSize);
                    
                    if (i < typedNumbers.length) {
                        screenCtx.font = '48px sans-serif';
                        screenCtx.textAlign = 'center';
                        screenCtx.textBaseline = 'middle';
                        screenCtx.fillText(typedNumbers[i], startX + i * (boxSize + boxSpacing) + boxSize / 2, startY + boxSize / 2);
                    }
                }

                // Candidate details if fully typed
                screenCtx.textAlign = 'left';
                screenCtx.textBaseline = 'top';
                if (typedNumbers.length === MAX_DIGITS) {
                    const candidate = MOCK_CANDIDATES[typedNumbers];
                    if (candidate) {
                        screenCtx.font = '28px sans-serif';
                        screenCtx.fillText(`Nome: ${candidate.name}`, 20, 240);
                        screenCtx.fillText(`Partido: ${candidate.party}`, 20, 280);
                    } else {
                        screenCtx.font = 'bold 48px sans-serif';
                        screenCtx.textAlign = 'center';
                        screenCtx.fillText('VOTO NULO', screenCanvas.width / 2, 260);
                    }
                }
            }

            // Footer instructions
            if (voteState === 'branco' || typedNumbers.length === MAX_DIGITS) {
                screenCtx.strokeStyle = '#000000';
                screenCtx.lineWidth = 2;
                screenCtx.beginPath();
                screenCtx.moveTo(0, 380);
                screenCtx.lineTo(screenCanvas.width, 380);
                screenCtx.stroke();

                screenCtx.textAlign = 'left';
                screenCtx.font = '18px sans-serif';
                screenCtx.fillText('Aperte a tecla:', 20, 395);
                screenCtx.fillText('VERDE para CONFIRMAR este voto', 40, 420);
                screenCtx.fillText('LARANJA para CORRIGIR este voto', 40, 445);
            }

            screenTexture.needsUpdate = true;
        }

        function resetVote() {
            voteState = 'typing';
            typedNumbers = '';
            updateScreen();
        }

        function processVotingInput(action, text) {
            if (voteState === 'fim') {
                if (text === 'CORRIGE') resetVote(); // Allows restarting the demo
                return false; 
            }

            if (text >= '0' && text <= '9') {
                if (voteState !== 'branco' && typedNumbers.length < MAX_DIGITS) {
                    typedNumbers += text;
                    updateScreen();
                }
                return false;
            }
            
            if (text === 'BRANCO') {
                if (typedNumbers.length === 0) {
                    voteState = 'branco';
                    updateScreen();
                }
                return false;
            }
            
            if (text === 'CORRIGE') {
                resetVote();
                return false;
            }
            
            if (action === 'confirma') {
                if (voteState === 'branco' || typedNumbers.length === MAX_DIGITS) {
                    voteState = 'fim';
                    updateScreen();
                    return true;
                }
            }
            return false;
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function animate() {
            requestAnimationFrame(animate);
            controls.update(); // required if controls.enableDamping is true
            renderer.render(scene, camera);
        }

        // Initialize application on window load
        window.onload = init;
    </script>
</body>
</html>
